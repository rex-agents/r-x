# Pushing a tag such as v1.2.0 tests rox, rix and rox-rex on macOS and Linux, then builds both for
# macOS and Linux on arm64 and amd64 and publishes them as a GitHub release, with
# checksums.txt and, when HOMEBREW_TAP_TOKEN is set, the Homebrew formula.
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# Run it from the Actions tab on an existing tag to rebuild that release.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, such as v1.2.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Check the tag
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$tag isn't a version tag such as v1.2.0 or v1.2.0-rc.1"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Summarize
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          {
            echo "## Released $tag"
            echo
            echo "| Archive | Size |"
            echo "| --- | --- |"
            for f in dist/*.tar.gz; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"
