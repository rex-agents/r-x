# Builds the landing page (site/src/landing) and docs/**/*.md into a Starlight (Astro) site in site/. Pull requests that touch
# the docs only build it; a push to main also deploys it to GitHub Pages.
# One-time setup: Settings -> Pages -> Source: GitHub Actions.
name: Docs

on:
  push:
    branches: [main]
    paths: [docs/**, site/**, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, site/**, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
        id: pages
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
