<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#313438">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="rux">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<title>rux</title>
<style>
:root {
  --bg: #313438; --panel: #2b2e32; --raise: #383b40; --line: #3b3e43; --line2: #34373b; --line3: #4a4d53;
  --text: #d4d8dc; --bright: #ececec; --muted: #9a9ea4; --faint: #7c8187;
  --accent: #e378b3; --accent-dim: #b65f90; --accent-bg: rgba(227, 120, 179, .07);
  --ok: #77db89; --err: #e77975; --warn: #ea8d79; --warm: #ea8d79; --ink: #1f2124;
  --green: var(--ok); --green-dim: #5fae6e; --green-bg: rgba(119, 219, 137, .1); --glow: none; /* semantic "ok" colors, used by ui.js */
  --accent2: #a78bfa; --ok-bg: rgba(119, 219, 137, .12); --warn-bg: rgba(234, 141, 121, .14); --scrim: rgba(20, 22, 24, .95); --select: #c0c5ca;
  /* a theme (GET /api/theme) overrides all of these on <html>: applyTheme */
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--bg); color: var(--text); }
body { font: 13px/1.6 var(--mono); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; display: flex; flex-direction: column; }
::selection { background: var(--accent); color: var(--ink); }
a { color: inherit; text-decoration: none; }
a:hover { color: #fff; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: var(--bright); background: transparent; border: 0; outline: 0; width: 100%; caret-color: var(--accent); }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
textarea { resize: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input:focus-visible, textarea:focus-visible { outline: 0; }
kbd { font: inherit; font-size: 12px; padding: 1px 7px; border-radius: 4px; background: var(--line); color: var(--text); }
h2.lbl, .lbl { font-size: 12px; font-weight: 500; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.spacer { flex: 1; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; display: inline-block; }
.dot.running { background: var(--ok); animation: blink 1.2s steps(2, start) infinite; }
.dot.idle, .dot.ok { background: var(--ok); }
.dot.failed, .dot.bad { background: var(--err); }
.dot.provisioning, .dot.starting, .dot.destroying, .dot.waking, .dot.sleeping { background: var(--warn); animation: blink 1.2s steps(2, start) infinite; }
.dot.lost { background: var(--warn); }
.dot.asleep { background: transparent; box-shadow: inset 0 0 0 1px var(--muted); }
@keyframes blink { to { visibility: hidden; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none !important; } }
.status { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); white-space: nowrap; }

/* shared header */
#top { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding: calc(10px + env(safe-area-inset-top)) 20px 10px; border-bottom: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 8px; color: var(--bright); font-weight: 700; font-size: 15px; }
.logo:hover { color: var(--bright); }
.logo i { width: 4px; height: 16px; border-radius: 2px; background: var(--accent); }
nav[data-seg] { display: flex; gap: 2px; }
nav[data-seg] a { padding: 10px; letter-spacing: .08em; color: var(--muted); }
nav[data-seg] a:hover { color: var(--bright); }
nav[data-seg] a[aria-current] { color: var(--accent); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px; }
.strip { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.strip b { font-weight: 400; color: var(--text); }
.strip > span { display: inline-flex; align-items: center; gap: 6px; }

/* shared footer */
#foot { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 20px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
#foot b { font-weight: 400; color: var(--text); }
#foot .hint { display: inline-flex; align-items: center; gap: 7px; }
#foot #hints { display: flex; flex-wrap: wrap; gap: 8px 16px; }

/* layout: pane + right sidebar on wide screens (work), the pane alone for pack and monitor */
#app { flex: 1; min-height: 0; display: flex; }
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; flex: 1; }
aside { display: flex; flex-direction: column; gap: 6px; width: 300px; flex: none; padding: 18px 14px; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; min-height: 0; }
body[data-mode="pack"] aside, body[data-mode="monitor"] aside { display: none; }
@media (min-width: 900px) { .back { display: none !important; } body[data-nobar] .pane-bar { display: none; } }
@media (max-width: 899px) {
  body[data-view="home"][data-mode="work"] .pane { display: none; }
  body[data-view="home"][data-mode="work"] aside { width: auto; flex: 1; border-left: 0; }
  body:not([data-view="home"]) aside, body:not([data-mode="work"]) aside { display: none; }
  input, textarea { font-size: 16px; }
  #foot #hints, .strip .wideonly { display: none; }
  #top { gap: 4px 12px; padding-left: 14px; padding-right: 14px; }
  .mascot { display: none; }
}
@media (max-height: 780px) { .mascot { display: none; } }

.hbar { flex: none; min-height: 48px; padding: 0 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
body[data-mode="pack"] .pane-bar, body[data-mode="monitor"] .pane-bar { display: none; }
.pane-bar { padding: 0; }
.bar-in { display: flex; align-items: center; gap: 12px; min-height: 48px; }
.btn { border: 1px solid var(--accent); color: var(--accent); padding: 3px 12px; border-radius: 8px; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; min-height: 30px; }
.btn:hover { background: var(--accent-bg); color: var(--accent); }
.back { color: var(--accent); font-size: 18px; width: 24px; }
.title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--bright); }
.icon-btn { color: var(--muted); padding: 4px 8px; border-radius: 6px; min-width: 32px; min-height: 32px; display: inline-flex; align-items: center; justify-content: center; }
.icon-btn:hover { color: var(--bright); background: var(--raise); }

/* sidebar: projects, their threads, new thread, mascot, leader */
.sb-h { display: flex; align-items: center; gap: 8px; padding: 0 6px 8px; }
.sb-plus { width: 32px; height: 32px; border-radius: 8px; color: var(--muted); display: flex; align-items: center; justify-content: center; }
.sb-plus:hover { background: var(--raise); color: var(--bright); }
.list { display: flex; flex-direction: column; gap: 2px; }
.empty { color: var(--muted); padding: 12px 10px; }
.proj { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--text); margin-top: 4px; }
.proj:hover { background: var(--raise); color: var(--bright); }
.proj.sel { background: var(--raise); color: var(--bright); box-shadow: inset 2px 0 0 var(--accent); }
.proj .pname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proj .pcount { flex: none; font-size: 12px; color: var(--muted); }
.proj .pcount.on { color: var(--ok); }
.proj.archive-link { margin-top: 14px; color: var(--muted); border-top: 1px solid var(--line); border-radius: 0 0 8px 8px; padding-top: 12px; }
.row { display: flex; gap: 10px; align-items: flex-start; padding: 5px 10px 5px 27px; border-radius: 6px; }
.row:hover { background: var(--raise); }
.row.sel { background: var(--raise); box-shadow: inset 2px 0 0 var(--accent); }
.row .dot { margin-top: 8px; }
.row-main { flex: 1; min-width: 0; }
.row-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
.row-sub { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.gone { opacity: .45; }
.row.unread .row-title { color: #fff; font-weight: 700; }
.row.unread .row-title::after, .proj.unread .pname::after { content: " ●"; color: var(--accent); font-size: 10px; vertical-align: 2px; }
.pnone { padding: 4px 10px 10px 27px; color: var(--muted); font-size: 12px; }
.sb-new { display: flex; align-items: center; justify-content: space-between; min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--accent); color: var(--accent); margin-top: 8px; }
.sb-new:hover { background: var(--accent-bg); color: var(--accent); }
.grow { flex: 1; min-height: 24px; }
.mascot { display: block; }
.leader-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); }
.leader-card div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.leader-card b { font-weight: 400; color: var(--bright); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.leader-card small { font-size: 12px; color: var(--muted); }

main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; }
.col { width: 100%; max-width: 920px; margin: 0 auto; padding: 0 20px; }
@media (max-width: 899px) { .col { padding: 0 16px; } }

/* archive, project page, settings */
.arow { display: flex; gap: 10px; align-items: baseline; padding: 6px 8px; border-radius: 6px; }
.arow:hover { background: var(--raise); }
.arow .pt1 { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.arow .pt2 { flex: none; font-size: 12px; color: var(--muted); }
.arow button { flex: none; font-size: 12px; color: var(--muted); padding: 2px 6px; border-radius: 4px; }
.arow button:hover { color: var(--accent); }
.arow button.danger:hover { color: var(--err); }
.tpanel { margin: 16px 0 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 6px; }
.tpanel-h { display: flex; gap: 10px; align-items: baseline; padding: 6px 8px 6px; }
.tpanel-h b { font-weight: 500; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); flex: 1; }
.tpanel .pnote, .pnote { padding: 4px 8px 6px; font-size: 12px; color: var(--muted); }
.intro { color: var(--muted); padding: 28px 0 8px; font-size: 13px; line-height: 1.7; }
.intro b { color: var(--text); font-weight: 500; }
.psec { padding: 24px 0 4px; }
.psec h2 { margin-bottom: 10px; display: flex; gap: 10px; align-items: baseline; }
.prow { display: flex; gap: 10px; align-items: baseline; padding: 7px 8px; border-radius: 6px; }
.prow:hover { background: var(--raise); }
.prow .dot { align-self: center; }
.prow .pt1 { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .pt2 { flex: none; font-size: 12px; color: var(--muted); }
.notes { width: 100%; min-height: 120px; border: 1px solid var(--line3); background: var(--panel); border-radius: 10px; padding: 12px; line-height: 1.55; font-size: 13px; }
.notes:focus { border-color: var(--accent); }
.saved { font-size: 12px; color: var(--ok); }
.repo-line { font-size: 12px; color: var(--muted); margin-bottom: 4px; overflow-wrap: anywhere; }
.ui-mini { color: var(--muted); font-size: 12px; }
.ui-mini:hover { color: var(--accent); }

/* authority settings: name, mascot, theme */
.topset { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; flex: none; border-radius: 8px; color: var(--muted); }
.topset:hover, .topset.sel { color: var(--accent); background: var(--raise); }
.sb-set { display: block; margin-top: 8px; padding: 6px 12px; border-radius: 8px; color: var(--muted); font-size: 13px; }
.sb-set:hover, .sb-set.sel { color: var(--accent); background: var(--raise); }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 4px; }
.tcard { text-align: left; border: 1px solid var(--line3); border-radius: 10px; padding: 10px; display: grid; gap: 6px; background: var(--panel); color: var(--text); }
.tcard:hover { border-color: var(--accent); }
.tcard[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tcard .sw { display: flex; height: 22px; border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
.tcard .sw span { flex: 1; }
.tcard b { font-weight: 600; font-size: 13px; color: var(--bright); }
.tcard small { color: var(--muted); font-size: 11.5px; line-height: 1.35; }
.tok { display: grid; grid-template-columns: 34px 82px 1fr auto; gap: 10px; align-items: center; padding: 5px 2px; border-bottom: 1px solid var(--line2); }
.tok input[type=color] { width: 34px; height: 26px; padding: 0; border: 1px solid var(--line3); border-radius: 6px; background: none; cursor: pointer; }
.tok code { font-size: 12px; color: var(--bright); }
.tok span { color: var(--muted); font-size: 12.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tok span i { font-style: normal; color: var(--faint); }
.tok button { font-size: 12px; color: var(--muted); padding: 2px 6px; }
.tok button:hover { color: var(--accent); }
.tok.over code::after { content: " *"; color: var(--accent); }
.mbox { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; margin-top: 6px; }
.mbox .logo { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--panel); max-width: 260px; }
.mbox .logo canvas { max-width: 100%; height: auto !important; }
.mbox .mside { flex: 1; min-width: 220px; display: grid; gap: 8px; }
.err { color: var(--err); font-size: 13px; }
.agent-tip { margin-top: 18px; font-size: 12px; color: var(--muted); line-height: 1.7; }
.agent-tip code { color: var(--bright); }

/* forms (project settings, new project) */
.new { padding: 28px 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
.new h2 { margin-bottom: 14px; }
.fields { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; margin-top: 4px; }
@media (min-width: 700px) { .fields.three { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; } }
.field { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); padding: 10px 2px; }
.field label { color: var(--muted); flex: none; font-size: 13px; }
.field label::after { content: ":"; }
.field:focus-within { border-color: var(--accent); }
select.sel { appearance: none; -webkit-appearance: none; font: inherit; color: var(--bright); background: transparent; border: 0; outline: 0; width: 100%; cursor: pointer; padding: 0; }
select.sel option { background: var(--raise); color: var(--text); }
select.sel:disabled { color: var(--faint); cursor: default; }
select.sel:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.field:has(select.sel):not(.mpick)::after { content: "▾"; color: var(--muted); font-size: 11px; }
.actions { display: flex; align-items: center; gap: 14px; margin-top: 20px; }
.hint { color: var(--muted); font-size: 12px; }
.start { background: var(--accent); color: var(--ink); font-weight: 700; padding: 8px 20px; border-radius: 8px; min-height: 36px; display: inline-flex; align-items: center; gap: 10px; }
.start:hover { color: var(--ink); filter: brightness(1.08); }
.start:disabled { opacity: .5; }
.start kbd { background: none; color: inherit; opacity: .75; padding: 0; font-weight: 500; }
.tools-set { display: grid; gap: 10px; margin-top: 4px; }
.tool-item { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; background: var(--panel); }
.tool-item .tn { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.tool-item .tn b { font-weight: 500; color: var(--bright); }
.tool-item .td { color: var(--muted); font-size: 13px; }
.tool-item .tw { color: var(--err); font-size: 12px; }
.tool-item label.ck { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); white-space: nowrap; flex: none; }
.tool-item label.ck input { flex: none; width: auto; margin: 0; accent-color: var(--accent); }
.rlist-wrap { margin-top: 6px; }

/* WORK: new thread */
.nt { max-width: 760px; margin: 0 auto; padding: 72px 24px 56px; display: flex; flex-direction: column; gap: 28px; }
@media (max-width: 899px) { .nt { padding: 20px 16px 40px; } }
.nt h1 { text-align: center; font-size: 26px; font-weight: 500; letter-spacing: -.01em; color: var(--bright); }
.nt h1 span { color: var(--accent); }
.nt .inproj { text-align: center; font-size: 12px; color: var(--muted); margin-top: -18px; }
.composer-card { background: var(--panel); border: 1px solid var(--line3); border-radius: 14px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); }
.composer-card:focus-within { border-color: var(--accent-dim); }
.prompt { min-height: 96px; font-size: 15px; line-height: 1.6; padding: 4px 6px; color: var(--bright); }
.crow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line3); background: transparent; color: var(--select); font-size: 12.5px; font-weight: 500; max-width: 280px; position: relative; }
.chip.repo { background: var(--raise); color: var(--bright); }
.chip:hover { color: var(--bright); border-color: var(--muted); }
.chip svg { flex: none; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip input { width: 9ch; min-width: 0; font-size: 12.5px; font-weight: 500; color: inherit; }
.chip:focus-within { border-color: var(--accent); }
.chip input:disabled { opacity: .6; }
.ddl { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 8px; border-radius: 8px; color: #c0c5ca; font-size: 12.5px; font-weight: 500; position: relative; }
.ddl:hover { color: var(--bright); }
.ddl:has(select:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.ddl select.sel { width: auto; field-sizing: content; color: inherit; font-size: 12.5px; font-weight: 500; padding-right: 2px; outline: 0 !important; }
.ddl::after { content: ""; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg) translate(-2px, -2px); margin-left: 2px; flex: none; }
.ddl.model { color: var(--bright); }
.run { margin-left: auto; display: inline-flex; align-items: center; gap: 10px; height: 38px; padding: 0 14px; border-radius: 8px; background: var(--accent); color: var(--ink); font-weight: 700; font-size: 13px; }
.run kbd { background: none; color: inherit; padding: 0; opacity: .75; font-weight: 500; }
.run:hover { filter: brightness(1.08); }
.run:disabled { opacity: .5; }
.runsin { text-align: right; padding: 0 6px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.runsin b { font-weight: 400; color: var(--text); }
.where { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 0 0 0 2px; }
.where .ddl { height: 28px; font-size: 12px; }
.where .ddl select.sel { font-size: 12px; color: var(--muted); }
.where .runsin { padding: 0 6px; }
.repos-h { display: flex; align-items: center; gap: 12px; padding: 0 4px; }
.search { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.search:focus-within { border-color: var(--accent); }
.search input { width: 150px; font-size: 12.5px; }
.rlist { border-radius: 12px; background: var(--panel); border: 1px solid var(--line); overflow: hidden auto; max-height: 440px; margin-top: 10px; }
.rrow { width: 100%; min-height: 46px; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line2); text-align: left; color: var(--text); }
.rrow:last-child { border-bottom: 0; }
.rrow:hover { background: var(--bg); }
.rrow[aria-pressed="true"] { background: var(--raise); color: #fff; }
.rrow .mk { width: 14px; flex: none; text-align: center; color: var(--accent); }
.rrow .rn { white-space: nowrap; }
.rrow .pd { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12px; }
.rrow .pt { color: var(--muted); font-size: 12px; flex: none; }
.badge { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--warn-bg); color: var(--warm); flex: none; }
.rnote { font-size: 12px; color: var(--muted); padding: 12px 16px; }
@media (max-width: 699px) { .chip { max-width: 100%; } .crow .spacer { display: none; } .run { width: 100%; justify-content: center; } }

/* transcript */
.tx { padding: 20px 0 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.turn { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 14px; }
.user { color: var(--bright); white-space: pre-wrap; overflow-wrap: anywhere; display: flex; gap: 10px; padding: 10px 14px; background: var(--raise); border-radius: 10px; }
.user::before { content: "›"; color: var(--accent); flex: none; }
.work { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.work:empty { display: none; }
.work.folded > :not(.fold) { display: none; }
.work:not(.folded) > .fold { display: none; }
.fold { justify-self: start; font-size: 12.5px; color: var(--muted); }
.fold:hover { color: var(--accent); }
.fold::before { content: "▸ "; color: var(--faint); }
.work.opened > .fold { display: block; } .work.opened > .fold::before { content: "▾ "; }
/* unseen: things Claude said since you last looked; the marker fades once seen */
.nw { position: relative; }
.nw::before { content: ""; position: absolute; left: -10px; top: 2px; bottom: 2px; width: 2px; border-radius: 1px; background: var(--accent); transition: opacity 1s; }
.nw.nw-out::before { opacity: 0; }
.newreply { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(100% + 10px); background: var(--raise); color: var(--accent); border: 1px solid var(--accent-dim); font-size: 12.5px; padding: 4px 14px; border-radius: 14px; z-index: 3; box-shadow: 0 6px 20px rgba(0, 0, 0, .5); }
.text { overflow-wrap: anywhere; }
.text p + p, .text p + pre, .text pre + p { margin-top: 10px; }
.text strong { color: var(--bright); }
.text code { color: var(--accent); background: var(--accent-bg); padding: 0 4px; border-radius: 3px; }
pre { font: 12.5px/1.55 var(--mono); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: pre; color: var(--text); }
.step { color: var(--muted); font-size: 13px; }
.step > button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; min-height: 24px; }
.step > button:hover .name { color: var(--accent); }
.step .sigil { color: var(--faint); flex: none; }
.step .name { color: var(--text); flex: none; }
.step .arg { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step .mark { flex: none; font-size: 12px; }
.mark.ok { color: var(--ok); } .mark.err { color: var(--err); }
.step .detail { margin: 6px 0 4px 16px; display: grid; gap: 6px; }
.step .detail pre { max-height: 50vh; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); }
.step:not(.open) .detail { display: none; }
.step.wake .name { color: var(--accent-dim); }
.err-line { color: var(--err); font-size: 13px; }
.err-line::before { content: "! "; }
.tool-run { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--panel); }
.tool-run .sum { margin: 4px 0 2px 16px; color: var(--text); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.tool-run .mark.run { color: var(--warn); }
.done { color: var(--muted); font-size: 12px; }
.done::before { content: "— "; }
.working { color: var(--muted); font-size: 13px; padding-bottom: 16px; }
.cursor { display: inline-block; width: .6em; height: 1.1em; background: var(--accent); vertical-align: -2px; margin-left: 6px; animation: blink 1s steps(2, start) infinite; }

/* shared files */
.asset { display: grid; gap: 6px; justify-items: start; }
.asset .cap { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.asset .cap::before { content: "# "; color: var(--faint); }
.asset .cap a { color: var(--accent); margin-left: 8px; }
.asset img, .asset video { display: block; max-width: 100%; max-height: 60vh; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.asset img { cursor: zoom-in; }
.asset .file { color: var(--accent); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.asset .file:hover { border-color: var(--accent-dim); background: var(--accent-bg); }
.step .detail img { max-width: 100%; max-height: 50vh; border: 1px solid var(--line); border-radius: 6px; cursor: zoom-in; }
.lightbox { position: fixed; inset: 0; z-index: 50; background: var(--scrim); overflow: auto; display: grid; place-items: center; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
.lightbox img { max-width: 100vw; max-height: 100dvh; cursor: zoom-in; }
.lightbox.full img { max-width: none; max-height: none; cursor: zoom-out; }
.lightbox .lb-bar { position: fixed; top: calc(env(safe-area-inset-top) + 10px); right: 12px; display: flex; gap: 8px; z-index: 1; }
.lightbox .lb-bar a, .lightbox .lb-bar button { background: var(--panel); border: 1px solid var(--line3); color: var(--accent); border-radius: 8px; padding: 4px 10px; font-size: 13px; }

/* reply composer (thread and project pages) */
#ftr { position: relative; flex: none; padding: 10px 0 12px; border-top: 1px solid var(--line); background: var(--bg); }
.opts .ddl { height: 28px; padding: 0 4px; font-size: 12px; }
.opts .ddl select.sel { font-size: 12px; }
.opts { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); padding: 0 0 6px 18px; }
.opts label { display: inline-flex; align-items: center; gap: 6px; }
.opts select.sel { width: auto; field-sizing: content; color: var(--text); font-size: 12px; }
.opts select.sel:hover { color: var(--accent); }
.opts select.sel:disabled { color: var(--faint); }
.composer { display: flex; align-items: flex-end; gap: 10px; }
.composer::before { content: "›"; color: var(--accent); padding: 6px 0; }
.composer textarea { max-height: 40vh; padding: 6px 0; line-height: 1.5; overflow-y: hidden; }
.attach-btn { flex: none; color: var(--muted); font-size: 17px; padding: 4px 2px; line-height: 1; }
.attach-btn:hover { color: var(--accent); }
.attach-strip { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 0 8px 18px; }
.attach-strip .th { position: relative; }
.attach-strip img { height: 56px; max-width: 120px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); display: block; }
.attach-strip .th button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 10px; background: var(--raise); border: 1px solid var(--line3); color: var(--text); font-size: 12px; line-height: 1; }

.user .imgs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.user .imgs img { max-height: 160px; max-width: 100%; border-radius: 6px; border: 1px solid var(--line); cursor: zoom-in; }
.older { display: contents; }
#main { overflow-anchor: none; } /* loadOlder keeps the scroll position itself */
.earlier { justify-self: center; color: var(--muted); font-size: 12px; padding: 4px 10px; }
.dropping #main { outline: 2px dashed var(--accent-dim); outline-offset: -8px; }
.send { flex: none; color: var(--ink); background: var(--accent); font-weight: 700; border-radius: 8px; padding: 5px 14px; font-size: 13px; min-height: 32px; }
.send:hover { filter: brightness(1.08); }
.send:disabled { color: var(--faint); background: var(--raise); filter: none; }
.send.stop { color: var(--err); background: none; border: 1px solid var(--err); }

/* thread menu */
.menu { position: relative; }
.menu-pop { position: absolute; right: 0; top: 34px; background: var(--raise); border: 1px solid var(--line3); border-radius: 10px; padding: 6px; z-index: 5; width: 260px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); }

.menu-pop button { display: block; width: 100%; text-align: left; padding: 6px 8px; border-radius: 6px; font-size: 13px; }
.menu-pop button:hover { background: var(--line); }
.menu-pop .danger { color: var(--err); }

/* PACK: leader -> project agents -> threads, and a details panel */
.pack { display: flex; flex-wrap: wrap; min-height: 100%; }
.pack-main { flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; }
.pack-banner { padding: 8px 20px; font-size: 12px; border-bottom: 1px solid var(--line); }
.pack-banner.warn { color: var(--warn); } .pack-banner.err { color: var(--err); }
.pack-tools { display: flex; align-items: center; justify-content: flex-end; padding: 10px 20px 0; font-size: 12px; color: var(--muted); }

.pack-cols { flex: 1; padding: 56px 32px 48px; display: flex; flex-wrap: wrap; align-items: stretch; justify-content: center; }
.pcol { flex: 1 1 200px; max-width: 260px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }

.pcol-cards { display: flex; flex-direction: column; gap: 10px; flex: 1; }
.conn { flex: 0 0 36px; display: flex; flex-direction: column; }

.conn .ln { display: flex; align-items: flex-start; padding-top: 59px; }

.pempty { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 14px 16px; border-radius: 10px; border: 1px dashed var(--line3); color: var(--muted); min-height: 96px; }

.details h2 { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--bright); overflow-wrap: anywhere; }
.details dl { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; font-size: 12.5px; }
.details dt { color: var(--muted); } .details dd { margin: 0; overflow-wrap: anywhere; }
.details dd.bad { color: var(--err); }
.details .open { align-self: flex-start; }
.details ul { list-style: none; padding: 0; display: grid; gap: 4px; font-size: 12.5px; }
.details ul a { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; }
.details ul a:hover { background: var(--raise); color: var(--accent); }
.details ul small { margin-left: auto; color: var(--muted); font-size: 11.5px; }

.panel-h .m { font-size: 12px; color: var(--muted); }
.scrollx { overflow-x: auto; }
table.mt { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 560px; }
.mt th { font-weight: 400; padding: 10px 16px; color: var(--muted); text-align: left; }
.mt td { padding: 12px 16px; border-top: 1px solid var(--line2); }
.kind { font-size: 11.5px; padding: 2px 7px; border-radius: 4px; background: var(--ok-bg); color: var(--ok); }
.mgrid { min-width: 760px; }

// prepImage reads an image for sending to Claude: big ones are scaled down
// (Claude sees at most about 1600px anyway) and re-encoded to stay small.
async function prepImage(file) {
  const toB64 = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });

  const bmp = await createImageBitmap(file);
  const max = 2000, scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
  let blob = file;
  if (!okType || scale < 1 || file.size > 1.5e6) {
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    blob = await new Promise(res => c.toBlob(res, "image/png"));
    if (blob.size > 1.5e6) blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.88));
  }
  bmp.close?.();
  const base = (file.name || "screenshot").replace(/\.[^.]+$/, "");
  return { name: base + (blob.type === "image/jpeg" ? ".jpg" : blob.type === "image/png" ? ".png" : "." + blob.type.split("/")[1]), mime: blob.type, data: await toB64(blob), url: URL.createObjectURL(blob) };
}

}


// ---------- monitor ----------
// guestActions are a guest row's sleep/wake and down buttons: sleep keeps the disk (like rox stop),
// down removes the guest (like rox down). A guest on another host of the pack goes there with ?authority=.
function guestActions(g, a, threadStatus) {
  const asleep = g.phase === "stopped" || g.phase === "exited" || g.phase === "asleep";
  const busy = threadStatus === "running";
  const call = async (btn, action, q) => {
    btn.disabled = true;
    try { await api("POST", `/api/guests/${encodeURIComponent(g.name)}/${action}` + (q.length ? "?" + q.join("&") : "")); }
    catch (err) { alert(err.message); btn.disabled = false; }
  };
  const mk = (label, cls, title, fn) => h("button", { class: cls, title, onclick: (e) => { e.preventDefault(); e.stopPropagation(); fn(e.currentTarget); } }, label);
  const q = a.local ? [] : ["authority=" + encodeURIComponent(a.name)];
  return h("div", { class: "gact" },
    asleep ? mk("wake", "", "start the guest again", (b) => call(b, "wake", q))
           : mk("sleep", "", "stop the guest and keep its disk (like rox stop)", (b) => call(b, "sleep", q)),
    mk("down", "danger", "remove the guest (like rox down)", (b) => {
      if (!confirm(`Remove guest ${g.name}?` + (g.thread ? " Its thread keeps its transcript but loses the guest's files." : " Its disk is deleted.") + (busy ? " A turn is running in it right now." : ""))) return;
      call(b, "down", busy ? [...q, "force=1"] : q);
    }));
}
// CLIENTS (pack.clients), HOSTS (pack.authorities) and GUESTS (authority.guests), from the pack feed.
const fmtGB = (b) => b >= 1 << 30 ? (b / (1 << 30)).toFixed(1) + "G" : Math.round((b || 0) / (1 << 20)) + "M";
function showMonitor() {
  const main = $("#main");
  const mon = h("div", { class: "mon-in" }, h("div", { class: "empty" }, "connecting…"));
  main.replaceChildren(mon);
  let live = false;
  const tick = setInterval(() => draw(), 5000);
  const stop = packFeed(() => draw(), (v) => { live = v; });
  // up/down move between the hosts; enter (or a click) filters the guests to the focused host
  function onKey(e) {
    if ((e.key !== "ArrowDown" && e.key !== "ArrowUp") || e.metaKey || e.ctrlKey || e.altKey || e.shiftKey || typingIn(e.target) || document.querySelector(".lightbox")) return;
    const hosts = [...mon.querySelectorAll("button.mg")];

    if (i < 0 && document.activeElement !== document.body && !mon.contains(document.activeElement)) return;
    e.preventDefault();
    hosts[i < 0 ? (e.key === "ArrowDown" ? 0 : hosts.length - 1) : Math.max(0, Math.min(hosts.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)))].focus();
  }
  addEventListener("keydown", onKey);
  cleanup = () => { stop(); clearInterval(tick); removeEventListener("keydown", onKey); };
  setFoot(["monitor", "all hosts"], [["↑↓", "move"], ["enter", "filter guests"]]);
  function draw() { if (mon.isConnected && document.body.dataset.mode === "monitor") keepFocus(mon, drawNow); }
  function drawNow() {
    const p = packState;
    if (!p) return;
    const auths = p.authorities || [], clients = p.clients || [];
    if (packSel.host && !auths.some(a => a.name === packSel.host)) packSel.host = null;
    setFoot(["monitor", packSel.host || "all hosts"], [["↑↓", "move"], ["enter", "filter guests"]]);
    const titles = new Map(allThreads(p).map(t => [t.id, t.title || t.id]));
    const up = auths.filter(a => a.status === "up");
    const slotsUsed = up.reduce((s, a) => s + (a.host?.guests_used || 0), 0), slotsMax = up.reduce((s, a) => s + (a.host?.guests_max || 0), 0);
    const cpus = up.reduce((s, a) => s + (a.host?.cpus || 0), 0), load = up.reduce((s, a) => s + (a.host?.load || 0), 0);
    const tile = (k, ...v) => h("div", { class: "tile" }, h("span", {}, k), h("b", {}, ...v));
    const head = (title, meta, right) => h("div", { class: "panel-h" }, h("h2", { class: "lbl", id: title.toLowerCase() + "-h" }, title), meta ? h("span", { class: "m" }, meta) : null, h("span", { class: "spacer" }), right || null);

    const clientRows = clients.map(c => h("tr", {},
      h("td", {}, h("span", { class: "kind" }, c.kind === "tui" ? "tui" : c.kind === "web" ? "web" : c.kind || "?")),
      h("td", { style: "color:var(--bright)" }, c.device || "?"), h("td", {}, c.authority || "-"),

      const ok = a.status === "up", hi = a.host || {}, on = a.name === packSel.host;
      return h("button", { type: "button", class: "mg", "data-k": "h:" + a.name, "aria-pressed": on ? "true" : "false", onclick: () => { packSel.host = on ? null : a.name; draw(); } },
        h("span", { class: "hn" }, h("span", { class: "dot " + packDot(a.status), "aria-hidden": "true" }), h("b", {}, a.name), a.name === p.leader ? h("span", { class: "star" }, "★ leader") : null),
        h("span", {}, ok ? hi.os || "?" : a.status), h("span", {}, ok ? String(hi.cpus || 0) : "-"),
        ok ? meter(hi.load || 0, hi.cpus || 0, "", (hi.load || 0).toFixed(1)) : h("span", {}, "-"),
        hi.guests_max ? meter(hi.guests_used || 0, hi.guests_max, "g", `${hi.guests_used || 0}/${hi.guests_max}`) : h("span", {}, "-"),
        h("span", {}, uptime(a.started)));
    });
    const threadStatus = new Map(allThreads(p).map(t => [t.id, t.status]));
    const shown = auths.filter(a => !packSel.host || a.name === packSel.host);
    const guestRows = shown.flatMap(a => (a.guests || []).map(g => {
      const frac = g.mem_limit ? Math.min(1, g.mem_bytes / g.mem_limit) : 0;
      return h("div", { class: "gr" },
        h("span", {}, g.name, auths.length > 1 && !packSel.host ? h("span", { class: "hosttag" }, a.name) : null),
        h("span", {}, g.phase || "-"), h("span", {}, g.backend || "-"), h("span", {}, (g.cpu || 0).toFixed(1) + "%"),
        h("span", {}, `${fmtGB(g.mem_bytes)}/${fmtGB(g.mem_limit)}`, h("div", { class: "mbar" }, h("i", { style: `width:${(frac * 100).toFixed(1)}%` }))),
        g.thread ? h("a", { class: "tl", href: "#/t/" + encodeURIComponent(g.thread), title: "open the thread" }, titles.get(g.thread) || g.thread) : h("span", {}, "-"),
        guestActions(g, a, threadStatus.get(g.thread)));
    }));

        tile("Guest slots", String(slotsUsed), slotsMax ? h("small", {}, "/" + slotsMax) : null), tile("Load · " + plural(cpus, "cpu").toUpperCase(), load.toFixed(1))),
      h("section", { class: "panel", "aria-labelledby": "clients-h" }, head("Clients", plural(clients.length, "client")),
        clients.length ? h("div", { class: "scrollx" }, h("table", { class: "mt" },
          h("thead", {}, h("tr", {}, ...["kind", "device", "authority", "last seen"].map(c => h("th", { scope: "col" }, c)))), h("tbody", {}, ...clientRows)))
          : h("div", { class: "pnote", style: "padding:16px" }, "no clients reported")),
      h("section", { class: "panel", "aria-labelledby": "hosts-h" }, head("Hosts", plural(auths.length, "host"), h("span", { class: "m" }, "select one to filter guests")),
        auths.length ? h("div", { class: "scrollx" }, h("div", { class: "mgrid" },
          h("div", { class: "mg head" }, ...["host", "os", "cpus", "load", "guests", "uptime"].map(c => h("span", {}, c))), ...hostRows))
          : h("div", { class: "pnote", style: "padding:16px" }, "no authorities")),
      h("section", { class: "panel", "aria-labelledby": "guests-h" }, head("Guests", null, h("span", { class: "m", style: packSel.host ? "color:var(--accent)" : "" }, packSel.host ? "host: " + packSel.host : "all hosts")),
        guestRows.length ? h("div", { class: "scrollx" }, h("div", { class: "gtable" },
          h("div", { class: "gr head" }, ...["guest", "phase", "backend", "cpu", "memory", "thread", ""].map(c => h("span", {}, c))), ...guestRows))
          : h("div", { class: "gempty" }, h("b", {}, "no guests running"), h("span", {}, "vms and containers started by threads show up here"))));

}

// Minimal markdown -> DOM (never innerHTML): code fences, inline code, bold, headings, paragraphs.
function md(src) {
  const frag = document.createDocumentFragment();
  src.split(/```[^\n]*\n?/).forEach((chunk, i) => {
    if (i % 2) { frag.append(h("pre", {}, chunk.replace(/\n$/, ""))); return; }
    for (const para of chunk.split(/\n{2,}/)) {
      if (!para.trim()) continue;
      const p = h("p");
      para.split("\n").forEach((line, k) => {
        if (k) p.append(h("br"));
        const head = line.match(/^#{1,6}\s+(.*)$/);
        if (head) { p.append(h("strong", {}, head[1])); return; }
        line.split(/(`[^`]+`|\*\*[^*]+\*\*)/).forEach((s, j) => {
          if (!(j % 2)) p.append(s);
          else if (s[0] === "`") p.append(h("code", {}, s.slice(1, -1)));
          else p.append(h("strong", {}, s.slice(2, -2)));
        });
      });
      frag.append(p);
    }
  });
  return frag;
}
