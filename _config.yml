# Jekyll config for the GitHub Pages docs site (built by .github/workflows/docs.yml).
title: r-x
description: rox, rix and rux
theme: jekyll-theme-cayman
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: false
titles_from_headings:
  enabled: true
  strip_title: true
# Only README.md and docs/ are the site; skip the Go sources and everything else.
include: [README.md]
exclude: [cmd, internal, integration, examples, go.mod, go.sum, Makefile, .github, vendor, dist]
