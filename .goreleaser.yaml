# Builds rox and rix for macOS and Linux on arm64 and amd64: one archive per platform with
# both binaries, plus checksums.txt, which self-update checks downloads against.
#
# Self-update downloads r-x_<version>_<os>_<arch>.tar.gz, so keep name_template and the
# archive format in step with internal/selfupdate.
version: 2
project_name: r-x

before:
  hooks:
    - go test ./...

builds:
  - id: rox
    main: ./cmd/rox
    binary: rox
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [arm64, amd64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version=v{{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: rix
    main: ./cmd/rix
    binary: rix
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [arm64, amd64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version=v{{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - ids: [rox, rix]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:", "^chore:"]

release:
  # Tags such as v1.2.0-rc.1 become prereleases, which self-update never installs.
  prerelease: auto
  footer: |
    ## Install

    ```sh
    brew install rex-agents/tap/r-x
    ```

    Or download the archive for your platform, check it against `checksums.txt`, and put
    `rox` and `rix` on your `PATH`. Both update themselves after that (`rox self-update`, `rix self-update`).

homebrew_casks:
  - name: r-x
    binaries: [rox, rix]
    repository:
      owner: rex-agents
      name: homebrew-tap
      token: '{{ index .Env "HOMEBREW_TAP_TOKEN" }}'
    # Without the tap token, publish the release and skip the cask.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}auto{{ else }}true{{ end }}'
    homepage: https://github.com/rex-agents/r-x
    description: Rex guests (rox) and the vault for their secrets (rix)
    caveats: |
      To make every rox and rix command a Rex action, run:
        rox rex install
      Moving from Python rox? Run rix migrate to bring over Git keys and agent credentials.
    hooks:
      post:
        # The binaries aren't notarized, so clear the quarantine Gatekeeper would refuse them for.
        install_steps: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/rox", "#{staged_path}/rix"]
          end
